{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "modeldock.secretName" . }}
  labels: {{- include "modeldock.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ required "secret.databaseUrl is required (or set existingSecret)" .Values.secret.databaseUrl | quote }}
  jwtSecret: {{ required "secret.jwtSecret is required (or set existingSecret)" .Values.secret.jwtSecret | quote }}
{{- end }}
