image:
  repository: modeldock/modeldock
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  # Several replicas are safe: the reconciler and outbox relay elect a single
  # leader through a Postgres advisory lock.
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 512Mi }

consumer:
  enabled: true
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

config:
  # "real" deploys model servers with client-go using the pod's service
  # account; "fake" is for demos only.
  kube: real
  events: kafka
  kafkaBrokers: "kafka:9092"
  kafkaCreateTopics: true
  rolloutTimeout: 5m
  autoRollback: false
  playground: false
  jwtIssuer: modeldock
  jwtAudience: modeldock-api

# Secrets: either reference an existing Secret with keys databaseUrl and
# jwtSecret, or let the chart create one from these values.
existingSecret: ""
secret:
  databaseUrl: ""
  jwtSecret: ""

# Namespaces model servers are deployed into. Must match the environments
# table (modeldock-staging, modeldock-prod).
targetNamespaces:
  create: true
  names: [modeldock-staging, modeldock-prod]

serviceMonitor:
  enabled: false
  interval: 15s
